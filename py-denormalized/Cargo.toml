[package]
name = "denormalized-python"
version = "0.0.13"
edition = "2021"
homepage = "https://github.com/probably-nothing-labs/denormalized.git"
repository = "https://github.com/probably-nothing-labs/denormalized.git"

[lib]
name = "denormalized_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = [
  "extension-module",
  "abi3",
  "abi3-py311",
] }
chrono = { workspace = true }
denormalized = { workspace = true, features = ["python"] }
datafusion = { workspace = true, features = [
  "avro",
  "unicode_expressions",
] }
# Vendored from datafusion-python 55.0.0. Only the module-init functions that
# denormalized registers into its own extension module were made public.
datafusion-python = { path = "vendor/datafusion-python" }
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
futures = { workspace = true }
